<!DOCTYPE html>
<html lang="es-MX">
<head>
  <title>Redirección - lerma.dev</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal oficial de lerma.dev. Encuentra aplicaciones web, PWA, APKs y ejecutables creados por Héctor Lerma, libres de anuncios y de uso libre."/>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/x-icon" href="https://lerma-dev.vercel.app/favicon.ico">
  <style>
    :root {
      --bg-color: #0b0b0b;
      --accent-blue: #0866ff;
      --text-main: #ffffff;
      --text-dim: #b0b0b0;
    }
    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: radial-gradient(
        circle at 50% 200px, 
        rgba(8, 102, 255, 0.12) 0%,
        transparent 70%
      );
    }
    .badge {
      background-color: #f0a10e;
      color: black;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      margin: 0 0 16px 0;
      background: linear-gradient(to bottom, #ffffff, #8ab4f8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      max-width: 650px;
    }
    p {
      color: var(--text-dim);
      max-width: 480px;
      font-size: 1.05rem;
      line-height: 1.5;
      margin: 0 0 35px 0;
    }
    .btn-home {
      background: var(--accent-blue);
      color: white;
      padding: 15px 35px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(8, 102, 255, 0.4);
    }
    .btn-home:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(8, 102, 255, 0.6);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Página Actualizada</span>
    <h1>El portal se ha mudado de plataforma</h1>
    <p>
      Hemos migrado oficialmente el sitio web a un nuevo entorno de hospedaje para brindarte una mejor experiencia.
    </p>
    <a href="https://lerma-dev.vercel.app" class="btn-home" aria-label="Ir al sitio web de lerma-dev.vercel.app">
      Ir a lerma-dev.vercel.app
    </a>
  </main>
</body>
</html>
